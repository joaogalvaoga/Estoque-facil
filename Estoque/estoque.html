<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque</title>
  <link rel="stylesheet" href="estoque.css">
</head>

<body>
  <header class="app-header">
    <div class="header-content">
      <h1>Meu Estoque</h1>
      <button class="btn-venda" onclick="abrirVendaPopup()">Realizar venda</button>
    </div>
  </header>

  <main class="app-main">
    <details class="form-produto">
      <summary class="form-title">
        <h2 id="novo-produto-titulo">Novo produto</h2>
      </summary>

      <label class="form-field form-field-name" for="produto">
        Produto
        <input type="text" id="produto" placeholder="Nome do produto">
      </label>
      <label class="form-field" for="quantidade">
        Quantidade
        <input type="number" id="quantidade" placeholder="0" inputmode="numeric">
      </label>
      <label class="form-field form-field-code" for="codigo">
        Código de barras
        <input type="text" id="codigo" placeholder="Código de barras" inputmode="numeric">
      </label>
      <label class="form-field" for="compra">
        Valor de compra
        <input type="number" id="compra" placeholder="0,00" inputmode="decimal">
      </label>
      <label class="form-field" for="venda">
        Valor de venda
        <input type="number" id="venda" placeholder="0,00" inputmode="decimal">
      </label>
      <label class="form-field" for="min_stock">
        Estoque mínimo
        <input type="number" id="min_stock" placeholder="0" inputmode="numeric">
      </label>

      <button class="btn-adicionar" onclick="addProduto()">Adicionar produto</button>
    </details>

    <div class="search-container">
      <input type="text" id="search" placeholder="Pesquisar por nome ou código" aria-label="Pesquisar produtos" onkeyup="pesquisar()">
      <button type="button" class="btn-camera" onclick="abrirLeitorCodigo()" aria-label="Ler código de barras com a câmera" title="Ler código de barras com a câmera">📷</button>
    </div>

    <div id="lista" class="container-produtos"></div>
  </main>

  <div id="barcode-popup" class="popup-overlay scanner-overlay" style="display:none">
    <section class="popup-card scanner-card" role="dialog" aria-modal="true" aria-labelledby="barcode-title">
      <div class="popup-header">
        <h3 id="barcode-title">Ler código de barras</h3>
        <button type="button" class="close-popup" onclick="fecharLeitorCodigo()" aria-label="Fechar leitor">×</button>
      </div>
      <div id="barcode-reader" class="barcode-reader"></div>
      <p id="barcode-status" class="scanner-status" role="status" aria-live="polite">Aponte a câmera para o código de barras.</p>
      <button type="button" class="scan-photo-btn" onclick="selecionarImagemCodigo()">Tirar foto do código</button>
      <input id="barcode-image" class="visually-hidden" type="file" accept="image/*" capture="environment" onchange="lerCodigoDaImagem(event)">
    </section>
  </div>

  <!-- POPUP DE VENDA -->
  <div id="venda-popup" class="popup-overlay" style="display:none">
    <div class="popup-card venda-card">
      <div class="popup-header">
        <h3>Registrar Venda</h3>
        <button class="close-popup" onclick="fecharVendaPopup()">×</button>
      </div>

      <div class="popup-body venda-body">
        <div class="venda-container">
          <!-- COLUNA 1: ITENS DISPONÍVEIS -->
          <div class="venda-section items-disponiveis">
            <div class="section-header">
              <h3>📦 Itens Disponíveis</h3>
            </div>
            <div class="popup-search">
              <input type="text" id="search-venda" placeholder="Pesquisar produto..." onkeyup="renderVendaSearch()">
            </div>
            <div id="venda-lista" class="items-list"></div>
          </div>

          <!-- COLUNA 2: ITENS PARA VENDER -->
          <div class="venda-section items-selecionados">
            <div class="section-header">
              <h3>🛒 Itens para Vender</h3>
            </div>
            <div id="fila-compra" class="items-list"></div>
            <div class="venda-footer">
              <p class="total-venda">Total: R$ <span id="total-venda">0.00</span></p>
              <button class="btn-finalizar" onclick="finalizarVenda()">✓ Finalizar Venda</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/node_modules/html5-qrcode/html5-qrcode.min.js"></script>
  <script src="estoque.js"></script>

</body>
</html>
